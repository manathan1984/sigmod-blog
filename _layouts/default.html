<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any">
  <link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ '/apple-touch-icon.png' | relative_url }}">
  {% feed_meta %}
</head>
<body>
  <div id="page-container">
    {% include header.html %}
    <div class="title-band">
      <div class="container">
        <p class="band-title"><a href="{{ '/' | relative_url }}">{{ site.title }}</a></p>
        <p class="band-description">{{ site.description }}</p>
      </div>
    </div>
    <div id="main-content">
      <div class="container">
        <div id="content-area">
          <div id="left-area">
            {{ content }}
          </div>
          {% include sidebar.html %}
        </div>
      </div>
    </div>
    {% include footer.html %}
  </div>
</body>
</html>
