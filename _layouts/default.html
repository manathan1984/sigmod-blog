<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- if page.legacy_redirect %}{% include legacy-redirect.html %}{% endif %}
  {% seo %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,300;0,400;0,500;0,700;1,400&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="icon" type="image/png" href="{{ '/assets/img/favicon.png' | relative_url }}">
  {% feed_meta %}
</head>
<body>
  <div id="page-container">
    {% include header.html %}
    <div class="title-band">
      <div class="container">
        <p class="band-title"><a href="{{ '/' | relative_url }}">{{ site.title }}</a></p>
        <p class="band-description">{{ site.description }}</p>
      </div>
    </div>
    <div id="main-content">
      <div class="container">
        <div id="content-area">
          <div id="left-area">
            {{ content }}
          </div>
          {% include sidebar.html %}
        </div>
      </div>
    </div>
    {% include footer.html %}
  </div>
</body>
</html>
