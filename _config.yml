title: ACM SIGMOD Blog
description: >-
  Catching the heartbeat of the data management community: perspectives on
  exciting and controversial topics, from and for the ACM SIGMOD community.
url: "https://sigmod-org.github.io"
baseurl: "/blog.sigmod.org"
# When moving to the custom domain blog.sigmod.org, set url to it and baseurl to "".

editors_page: /editors/
sigmod_url: "https://sigmod.org"

timezone: UTC
permalink: /:year/:month/:day/:title/
paginate: 10
paginate_path: "/page/:num/"

include: [_pages]
exclude: [README.md, SUBMITTING.md, Gemfile, Gemfile.lock, vendor, .bundle]

plugins:
  - jekyll-paginate
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: feed.xml

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "_pages" }
    values: { layout: page }
